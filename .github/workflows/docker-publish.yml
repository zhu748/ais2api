name: Build and Publish Package

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to publish, for example v1.0.0"
        required: true
        default: "manual"
      latest:
        description: "Also publish the latest tag"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  build_and_publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare image metadata
        id: prep
        shell: bash
        run: |
          OWNER_LC="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          REPO_LC="$(echo '${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')"
          IMAGE_NAME="ghcr.io/${OWNER_LC}/${REPO_LC}"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION_TAG="${{ github.event.inputs.version }}"
            ADD_LATEST="${{ github.event.inputs.latest }}"
          else
            VERSION_TAG="main-${GITHUB_SHA::7}"
            ADD_LATEST="true"
          fi

          TAGS="${IMAGE_NAME}:${VERSION_TAG}"
          if [[ "${ADD_LATEST}" == "true" ]]; then
            TAGS="${TAGS},${IMAGE_NAME}:latest"
          fi

          echo "image_name=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_tag=${VERSION_TAG}" >> "$GITHUB_OUTPUT"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Get Camoufox download URL
        id: get_camoufox_url
        shell: bash
        run: |
          URL="$(curl -fsSL "https://api.github.com/repos/${{ github.repository }}/releases/latest" | grep "browser_download_url.*camoufox-linux.tar.gz" | cut -d : -f 2,3 | tr -d '", ')"
          echo "CAMOUFOX_URL=${URL}" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.prep.outputs.tags }}
          build-args: |
            CAMOUFOX_URL=${{ env.CAMOUFOX_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Show published tags
        shell: bash
        run: |
          echo "Published image: ${{ steps.prep.outputs.image_name }}"
          echo "Published tags: ${{ steps.prep.outputs.tags }}"
